<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present Experiment</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:sans-serif;
  overflow:hidden;
}

#flash{
  position:fixed;
  inset:0;
  background:black;
}

#dot{
  position:fixed;
  left:50%;
  top:50%;
  width:10px;
  height:10px;
  margin:-5px;
  background:white;
  border-radius:50%;
  display:none;
}

.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:black;
}

button{
  padding:14px 22px;
  border-radius:999px;
  border:none;
  font-weight:bold;
}

#sliderWrap{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
  display:none;
}

#results{
  position:fixed;
  inset:0;
  background:black;
  display:none;
}

canvas{
  width:100%;
  height:60vh;
  background:#050505;
}
</style>
</head>

<body>

<div id="flash"></div>
<div id="dot"></div>

<div id="warning" class="overlay">
  <div>
    <h1>⚠️ Warning</h1>
    <p>Flashing lights present</p>
    <button onclick="goEmotion()">I Understand</button>
  </div>
</div>

<div id="emotion" class="overlay" style="display:none;">
  <div>
    <h1>State before?</h1>
    <select id="emotionSelect">
      <option>Calm</option>
      <option>Focused</option>
      <option>Anxious</option>
      <option>Tired</option>
    </select>
    <br><br>
    <button onclick="prep()">Start</button>
  </div>
</div>

<div id="count" class="overlay" style="display:none;">
  <h1 id="countText">3</h1>
</div>

<div id="sliderWrap">
  <input id="slider" type="range" min="0.5" max="20" step="0.01" value="4" style="width:80%">
</div>

<div id="results">
  <h2 id="meta"></h2>
  <canvas id="graph"></canvas>
  <br>
  <button onclick="downloadCSV()">CSV</button>
  <button onclick="downloadPNG()">Graph</button>
</div>

<script>

let running=false;
let startTime=0;
let phase=0;
let samples=[];
let emotion="";
let lastSample=0;

const flash=document.getElementById("flash");
const slider=document.getElementById("slider");
const graph=document.getElementById("graph");
const ctx=graph.getContext("2d");

function goEmotion(){
  warning.style.display="none";
  emotionDiv.style.display="flex";
}

const emotionDiv=document.getElementById("emotion");

function prep(){
  emotion=emotionSelect.value;
  emotionDiv.style.display="none";
  count.style.display="flex";

  let c=3;
  countText.innerText=c;

  let t=setInterval(()=>{
    c--;
    countText.innerText=c;
    if(c<=0){
      clearInterval(t);
      count.style.display="none";
      start();
    }
  },1000);
}

function start(){
  running=true;
  startTime=performance.now();
  samples=[];
  sliderWrap.style.display="block";
  dot.style.display="block";
  requestAnimationFrame(loop);
}

function loop(t){
  if(!running) return;

  let dt=(t-startTime)/1000;
  let hz=Number(slider.value);

  phase+=hz*0.1;
  let v=(Math.sin(phase)+1)/2*255;
  flash.style.background=`rgb(${v},${v},${v})`;

  if(dt-lastSample>0.05){
    samples.push({t:dt,hz:hz});
    lastSample=dt;
  }

  if(dt>=10){
    finish();
    return;
  }

  requestAnimationFrame(loop);
}

function finish(){
  running=false;
  sliderWrap.style.display="none";
  dot.style.display="none";
  results.style.display="block";

  meta.innerHTML=`<b>State (before): ${emotion}</b><br>10 seconds`;

  drawGraph();
}

function drawGraph(){
  let w=graph.clientWidth;
  let h=graph.clientHeight;

  graph.width=w;
  graph.height=h;

  ctx.fillStyle="#050505";
  ctx.fillRect(0,0,w,h);
ctx.fillStyle="rgba(255,255,255,0.7)";
ctx.fillText("Send results to: vg23563@bristol.ac.uk", pad, 70);
  let pad=80;
  let pw=w-pad*2;
  let ph=h-pad*2;

  ctx.strokeStyle="white";
  ctx.beginPath();

  samples.forEach((s,i)=>{
    let x=pad+(s.t/10)*pw;
    let y=pad+ph-(s.hz/20)*ph;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.stroke();

  ctx.fillStyle="white";
  ctx.fillText("Present Experiment",pad,30);
  ctx.fillText("State: "+emotion,pad,50);
  ctx.fillText("Hz",pad-30,pad);
  ctx.fillText("Time",w-pad-40,h-pad+30);
}

function downloadCSV(){
  let rows=[
    "Present Experiment Data",
    "Send results to: vg23563@bristol.ac.uk",
    "",
    "time,hz,emotion"
  ];

  samples.forEach(s=>{
    rows.push(`${s.t},${s.hz},${emotion}`);
  });

  let blob=new Blob([rows.join("\n")]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}

function downloadPNG(){
  drawGraph();

  let a=document.createElement("a");
  a.href=graph.toDataURL();
  a.download="graph.png";
  a.click();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present Experiment</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:black;
  color:white;
  font-family:sans-serif;
  overflow:hidden;
}

#flash{
  position:fixed;
  inset:0;
  background:black;
}

/* overlays */
.overlay{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:10;
}

.overlayBox{
  max-width:500px;
}

button{
  padding:14px 22px;
  border-radius:999px;
  border:none;
  font-weight:bold;
  margin-top:20px;
}

/* slider */
#sliderWrap{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
  display:none;
}

input[type=range]{
  width:80%;
}

/* graph */
#graphWrap{
  position:fixed;
  bottom:100px;
  width:100%;
  display:none;
  text-align:center;
}

canvas{
  background:#111;
}
</style>
</head>

<body>

<div id="flash"></div>

<!-- WARNING -->
<div id="warning" class="overlay">
  <div class="overlayBox">
    <h2>⚠️ Warning</h2>
    <p>This contains flashing lights.</p>
    <p>Do not continue if you have epilepsy.</p>
    <button onclick="nextToEmotion()">I Understand</button>
  </div>
</div>

<!-- EMOTION -->
<div id="emotion" class="overlay" style="display:none;">
  <div class="overlayBox">
    <h1>How do you feel?</h1>
    <select id="emotionSelect">
      <option>Calm</option>
      <option>Focused</option>
      <option>Anxious</option>
      <option>Tired</option>
      <option>Curious</option>
    </select>
    <br>
    <button onclick="prep()">Start</button>
  </div>
</div>

<!-- INSTRUCTION -->
<div id="instruction" class="overlay" style="display:none;">
  <div class="overlayBox">
    <h2>You have 10 seconds</h2>
    <p>Interact with the slider</p>
    <div id="countdown">3</div>
  </div>
</div>

<!-- SLIDER -->
<div id="sliderWrap">
  <input id="slider" type="range" min="0.5" max="20" step="0.1" value="4">
</div>

<!-- GRAPH -->
<div id="graphWrap">
  <canvas id="graph" width="600" height="300"></canvas>
  <br>
  <button onclick="downloadCSV()">Download CSV</button>
</div>

<script>
let phase=0;
let running=false;
let startTime=0;
let samples=[];
let emotion="";

function nextToEmotion(){
  warning.style.display="none";
  emotionDiv.style.display="flex";
}

function prep(){
  emotion = emotionSelect.value;
  emotionDiv.style.display="none";
  instruction.style.display="flex";

  let c=3;
  countdown.innerText=c;

  let timer=setInterval(()=>{
    c--;
    countdown.innerText=c;
    if(c<=0){
      clearInterval(timer);
      instruction.style.display="none";
      startExperiment();
    }
  },1000);
}

function startExperiment(){
  sliderWrap.style.display="block";
  running=true;
  startTime=performance.now();
  samples=[];
  requestAnimationFrame(loop);
}

function loop(t){
  if(!running) return;

  let elapsed = t - startTime;
  let hz = Number(slider.value);

  phase += hz * 0.1;
  let v = (Math.sin(phase)+1)/2 * 255;

  flash.style.background = `rgb(${v},${v},${v})`;

  samples.push({
    t: elapsed/1000,
    hz: hz,
    emotion: emotion
  });

  if(elapsed >= 10000){
    running=false;
    sliderWrap.style.display="none";
    showGraph();
    return;
  }

  requestAnimationFrame(loop);
}

function showGraph(){
  graphWrap.style.display="block";
  let ctx = graph.getContext("2d");

  ctx.clearRect(0,0,600,300);
  ctx.strokeStyle="white";
  ctx.beginPath();

  samples.forEach((s,i)=>{
    let x = s.t/10 * 600;
    let y = 300 - (s.hz/20 * 300);
    if(i==0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.stroke();
}

function downloadCSV(){
  let rows = ["time,hz,emotion"];
  samples.forEach(s=>{
    rows.push(`${s.t},${s.hz},${s.emotion}`);
  });

  let blob = new Blob([rows.join("\n")]);
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "results.csv";
  a.click();
}
</script>

</body>
</html>
